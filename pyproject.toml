[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopcode"
version = "0.1.0"
description = "Windows desktop launcher for local opencode-multi agent-loop projects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hukaBU" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5"
]
build = [
  "pyinstaller>=6"
]

[tool.setuptools]
py-modules = ["launcher", "self_improve"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
